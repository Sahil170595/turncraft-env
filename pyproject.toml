[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turncraft-env"
version = "0.1.0"
description = "State-grounded customer-service tool environment with isolated model roles and deterministic reward evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sahil"}]
dependencies = ["anthropic>=0.100,<1", "pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
turncraft = "turncraft.demo:main"
turncraft-eval = "turncraft.evaluate:main"
turncraft-viewer = "turncraft.viewer:main"

[project.urls]
Repository = "https://github.com/Sahil170595/turncraft-env"
Portfolio = "https://chimeraforge.vercel.app/work"

[tool.setuptools.packages.find]
include = ["turncraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
